name: Deploy to Azure

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify build
        run: npm run build

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secreto DATABASE_URL del repositorio."
            echo "Sin el no se pueden aplicar las migraciones a la base de produccion."
            echo "Se aborta a proposito: es preferible no desplegar a desplegar contra un esquema viejo."
            exit 1
          fi
          # Neon suspende la base cuando no se usa y despertarla puede pasarse
          # del timeout (P1002). Es un fallo de red, no del esquema, asi que se
          # reintenta antes de dar por rota la migracion.
          for intento in 1 2 3; do
            if npx prisma migrate deploy; then exit 0; fi
            echo "Intento $intento fallido; se reintenta en $((intento * 10))s"
            sleep $((intento * 10))
          done
          echo "::error::No se pudieron aplicar las migraciones tras 3 intentos."
          exit 1

      - name: Prepare deployment package
        run: |
          mkdir -p deploy_package
          rsync -av --exclude='node_modules' \
                    --exclude='.env' \
                    --exclude='.env.*' \
                    --exclude='.github' \
                    --exclude='keys' \
                    --exclude='jest.config.js' \
                    --exclude='README.md' \
                    --exclude='deploy_package' \
                    --exclude='.git' \
                    --exclude='dist' \
                    ./ deploy_package/

      - name: Zip package
        run: cd deploy_package && zip -r ../deploy.zip . -x ".*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: eco2-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip
